apiVersion: v1
kind: Namespace
metadata:
  name: emr-zombie-killer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emr-zombie-killer
  namespace: emr-zombie-killer
  annotations:
    # IRSA: role needs emr-containers:DescribeJobRun + CancelJobRun (see config/iam/policy.json)
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/emr-zombie-killer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: emr-zombie-killer
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [zombie.lucabem.io]
    resources: [zombiepolicies]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: emr-zombie-killer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: emr-zombie-killer
subjects:
  - kind: ServiceAccount
    name: emr-zombie-killer
    namespace: emr-zombie-killer
